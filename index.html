<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="color-scheme" content="light"><title>YouTube-Digest · Archiv</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"><style>
:root{--ink:#111;--grey:#6e6e6e;--light:#a8a8a8;--rule:#e6e6e6;--tint:#f5f5f3;--accent:#e4002b;
--font:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.stat b,.rank,.sec span,ol.take li::before{font-variant-numeric:tabular-nums}
a{color:inherit}
main{max-width:1120px;margin:0 auto;padding:24px 20px 96px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:12px;
border-bottom:3px solid var(--ink);font-size:13px;font-weight:700;letter-spacing:.02em}
.top span{font-weight:500;color:var(--grey)}
.top a{text-decoration:none}
.hero{padding:48px 0 40px}
.weekday{margin:0 0 6px;font-size:20px;font-weight:500;color:var(--grey)}
.date{margin:0;font-size:clamp(84px,21vw,232px);font-weight:800;line-height:.82;letter-spacing:-.06em}
.date i{font-style:normal;color:var(--accent)}
.facts{display:grid;grid-template-columns:1fr;gap:28px;margin-top:44px;padding-top:16px;border-top:1px solid var(--rule)}
.lede{margin:0;max-width:30ch;font-size:18px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:0 0 0 14px;border-left:1px solid var(--rule);text-decoration:none}
.stat:first-child{padding-left:0;border-left:0}
.stat b{display:block;font-size:44px;font-weight:700;line-height:1;letter-spacing:-.04em}
.stat span{font-size:13px;color:var(--grey)}
.stat.hot b{color:var(--accent)}
section{margin-top:80px;scroll-margin-top:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:3px solid var(--ink);
margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sec span{color:var(--grey);letter-spacing:0}
.thumb{display:block;aspect-ratio:16/9;overflow:hidden;background:var(--tint)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.meta{font-size:13px;color:var(--grey)}
.tag{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--ink);color:var(--ink);font-size:11px;
font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
h3 a,h4 a{text-decoration:none}
h3 a:hover,h4 a:hover{color:var(--accent)}
.hot-item{display:grid;grid-template-columns:1fr;gap:18px;padding:36px 0 40px;border-bottom:1px solid var(--rule)}
.rank{font-size:48px;font-weight:800;line-height:.9;letter-spacing:-.05em;color:var(--accent)}
.hot-item h3{margin:6px 0 26px;font-size:clamp(24px,3.2vw,34px);font-weight:700;line-height:1.12;letter-spacing:-.025em}
.label{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
ol.take{list-style:none;counter-reset:t;margin:0;padding:0}
ol.take li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;padding:12px 0;border-top:1px solid var(--rule)}
ol.take li:first-child{border-top:0}
ol.take li::before{content:counter(t,decimal-leading-zero);font-weight:700;color:var(--accent);font-size:14px;
padding-top:2px}
.none{margin:8px 0 0;color:var(--grey)}
.snippet{margin-top:24px;padding:18px 20px 20px;background:var(--tint)}
.snippet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.copy{border:0;background:none;padding:0;font:700 12px var(--font);letter-spacing:.08em;text-transform:uppercase;
color:var(--accent);cursor:pointer}
.snippet pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13.5px/1.65 var(--mono);color:var(--ink)}
.watch{display:inline-block;margin-top:26px;padding-bottom:2px;border-bottom:2px solid var(--ink);font-weight:700;
text-decoration:none}
.watch:hover{color:var(--accent);border-color:var(--accent)}
.maybe-item{display:grid;grid-template-columns:112px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--rule)}
.maybe-item h4{margin:2px 0 6px;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.maybe-item p{margin:0;color:var(--grey);font-size:15px;line-height:1.45}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:18px 0;
border-bottom:1px solid var(--rule);font-weight:500}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:22px;line-height:1;font-weight:400}
details[open] summary::after{content:"\2212"}
details ul{list-style:none;margin:0;padding:0}
details li{padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.4}
details li a{text-decoration:none}
details li a:hover{color:var(--accent)}
details li span{color:var(--light)}
.empty{padding:40px 0;font-size:clamp(32px,5vw,48px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.empty span{display:block;margin-top:12px;font-size:16px;font-weight:400;letter-spacing:0;color:var(--grey)}
footer{margin-top:96px;padding-top:12px;border-top:3px solid var(--ink);font-size:13px;color:var(--grey);
display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
footer .err{flex-basis:100%;color:var(--accent)}
.archive a{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--rule);
font-size:20px;font-weight:600;text-decoration:none}
.archive a:hover{color:var(--accent)}
.archive a span{color:var(--light);font-weight:400}
@media (min-width:760px){
main{padding:32px 40px 120px}
.hero{padding:72px 0 56px}
.facts{grid-template-columns:5fr 7fr;align-items:end}
.hot-item{grid-template-columns:88px minmax(0,1fr) minmax(0,400px);gap:0 32px;padding:44px 0 48px}
.hot-item .thumb{grid-column:3;grid-row:1;align-self:start;position:sticky;top:24px}
.hot-item .rank{grid-column:1;grid-row:1}
.hot-item .content{grid-column:2;grid-row:1}
.maybe-item{grid-template-columns:88px 200px minmax(0,1fr);gap:0 32px;padding:24px 0}
.maybe-item .thumb{grid-column:2}
.maybe-item .text{grid-column:3}
details{margin-left:120px}}
</style></head><body><main><div class="top"><a href="./">YouTube-Digest</a><span>1 Ausgaben</span></div><header class="hero"><h1 class="date">Archiv<i>.</i></h1></header><section class="archive"><a href="2026-09-25.html">Freitag, 25.09. <span>2026</span></a></section></main></body></html>
